version: '2.4'

volumes:
  sense-data:
  grafana-data:
  netbird-data:

services:
  influxdb:
    image: influxdb:2.7.11
    restart: always
    volumes:
      - sense-data:/var/lib/influxdb2
    environment:
      INFLUXD_LOG_LEVEL: info
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_ORG: balena
      DOCKER_INFLUXDB_INIT_BUCKET: balena-sense
      DOCKER_INFLUXDB_INIT_RETENTION: '0'

  grafana:
    build: ./grafana
    restart: always
    depends_on:
      - influxdb
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      GF_SERVER_HTTP_PORT: '3000'
      GF_PATHS_PROVISIONING: /usr/src/app/provisioning
      GF_SESSION_PROVIDER: memory
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:3000/api/health >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    build: ./nginx
    restart: always
    depends_on:
      - grafana
    ports:
      - "80:80"
    environment:
      BRM_VERSION: '1.8.0'
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/healthz || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  netbird:
    build: ./netbird
    restart: always
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - netbird-data:/var/lib/netbird
    environment:
      NB_LOG_LEVEL: info
    healthcheck:
      test:
        - CMD-SHELL
        - /usr/local/bin/brm-netbird-healthcheck.sh
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  counter:
    build: ./counter
    restart: always
    depends_on:
      - influxdb
    privileged: true
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: balena
      INFLUX_BUCKET: balena-sense
